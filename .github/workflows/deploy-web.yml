name: 部署网页演示（GitHub Pages）

# 只构建静态前端。后端（apps/api）不在 Pages 上运行：
# 静态模式在浏览器内执行同一套领域引擎，数据写入 localStorage。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本机验证、Dockerfile 保持一致：node:sqlite 在 22.x 仍属实验特性，未在 CI 路径上验证
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: 构建静态演示（公共路径为仓库名）
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 让 404 回退知道真实公共路径
        run: sed -i "s|__BASE__|/${{ github.event.repository.name }}/|g" apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
